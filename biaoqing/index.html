<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf6ee">
<title>表情图片展示</title>
<style>
  :root{
    --bg:#fdf6ee;
    --text:#4a3b2f;
    --muted:#a99078;
    --accent:#ff8a3d;
    --line:rgba(190,150,110,.18);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    min-height:100vh;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 520px at 6% -10%, #ffe9d2 0%, rgba(255,233,210,0) 60%),
      radial-gradient(820px 480px at 104% 0%, #ffe1d1 0%, rgba(255,225,209,0) 55%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 顶栏 ---------- */
  .header{
    position:sticky;top:0;z-index:30;
    background:rgba(253,246,238,.86);
    -webkit-backdrop-filter:blur(12px);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:1280px;margin:0 auto;
    padding:11px 18px;
    display:flex;align-items:center;gap:10px;
  }
  .logo{font-size:18px;line-height:1;}
  .header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.3px;}
  .count{
    font-size:12px;color:var(--accent);
    background:rgba(255,138,61,.12);
    padding:2px 9px;border-radius:999px;
  }
  .hint{margin-left:auto;font-size:12px;color:var(--muted);}
  @media (max-width:520px){ .hint{display:none;} }

  /* ---------- 瀑布流 ---------- */
  .waterfall{
    max-width:1280px;margin:0 auto;
    padding:16px 18px 60px;
    column-width:170px;      /* 瀑布流核心：多列自适应 */
    column-gap:12px;
  }
  .card{
    break-inside:avoid;
    -webkit-column-break-inside:avoid;
    page-break-inside:avoid;
    position:relative;
    margin:0 0 12px;
    border-radius:14px;
    overflow:hidden;
    cursor:zoom-in;
    min-height:80px;
    background:linear-gradient(100deg,#f3e7d8 30%,#f9f1e6 50%,#f3e7d8 70%);
    background-size:200% 100%;
    animation:shimmer 1.4s linear infinite;
    box-shadow:0 2px 10px rgba(180,130,80,.12);
    transition:transform .22s ease, box-shadow .22s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .card.loaded{animation:none;background:#f3e7d8;}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(180,130,80,.24);}
  @keyframes shimmer{to{background-position:-200% 0;}}

  .card img{
    display:block;width:100%;height:auto;
    opacity:0;
    transition:opacity .35s ease;
    -webkit-user-drag:none;user-select:none;
  }
  .card.loaded img{opacity:1;}
  .card.failed{min-height:80px;}
  .card.failed img{display:none;}
  .card.failed::after{
    content:"图片加载失败";
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;color:var(--muted);
  }

  /* ---------- 左上角格式徽章 ---------- */
  .fmt-badge{
    position:absolute;top:8px;left:8px;z-index:2;
    font-size:10.5px;font-weight:700;
    line-height:1;letter-spacing:.6px;
    padding:5px 8px;border-radius:7px;
    color:#fff;
    background:rgba(74,59,47,.58);
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
    pointer-events:none;
    user-select:none;
    box-shadow:0 1px 4px rgba(0,0,0,.12);
  }
  /* 动图（GIF / APNG）用主题色高亮，一眼可辨 */
  .fmt-badge.is-anim{
    background:rgba(255,138,61,.95);
    box-shadow:0 2px 8px rgba(220,120,50,.4);
  }

  .copy-btn{
    position:absolute;top:8px;right:8px;z-index:2;
    border:0;border-radius:999px;
    padding:6px 12px;
    font:inherit;font-size:12px;line-height:1;
    color:#fff;background:rgba(255,138,61,.94);
    cursor:pointer;
    opacity:0;transform:translateY(-4px);
    transition:opacity .2s ease, transform .2s ease, background .2s;
    box-shadow:0 2px 8px rgba(220,120,50,.35);
  }
  .copy-btn:hover{background:#f4762a;}
  .copy-btn:disabled{cursor:default;opacity:.85;}
  .card:hover .copy-btn,
  .card:focus-within .copy-btn{opacity:1;transform:translateY(0);}
  @media (hover:none){
    .copy-btn{opacity:1;transform:none;}
  }

  /* ---------- 灯箱 ---------- */
  .lightbox{
    position:fixed;inset:0;z-index:100;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:14px;padding:24px;
    background:rgba(44,30,20,.74);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    opacity:0;visibility:hidden;
    transition:opacity .22s ease, visibility .22s;
  }
  .lightbox.open{opacity:1;visibility:visible;}
  .lightbox img{
    max-width:92vw;
    max-height:calc(100vh - 190px);
    max-height:calc(100dvh - 190px);
    object-fit:contain;
    border-radius:12px;
    background:#fff;
    box-shadow:0 24px 64px rgba(0,0,0,.45);
    transform:scale(.94);
    transition:transform .26s cubic-bezier(.2,.8,.3,1);
  }
  .lightbox.open img{transform:scale(1);}
  .lb-status{
    font-size:12px;color:rgba(255,255,255,.72);
    min-height:16px;letter-spacing:.3px;
    text-align:center;
  }
  .lb-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .lb-bar button{
    font:inherit;font-size:13px;
    padding:9px 18px;border-radius:999px;
    border:1px solid rgba(255,255,255,.28);
    background:rgba(255,255,255,.14);
    color:#fff;cursor:pointer;
    transition:background .2s,border-color .2s;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }
  .lb-bar button:hover{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.5);}
  .lb-bar button:disabled{opacity:.6;cursor:default;}
  .lb-bar .primary{background:rgba(255,138,61,.92);border-color:transparent;}
  .lb-bar .primary:hover{background:#f4762a;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:34px;
    transform:translate(-50%,16px);
    z-index:200;
    background:rgba(58,42,30,.94);
    color:#fff;font-size:13px;
    padding:10px 20px;border-radius:999px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <span class="logo">😄</span>
    <h1>表情图片展示</h1>
    <span class="count" id="count"></span>
    <span class="hint">点击看原图 · 悬停复制</span>
  </div>
</header>

<main class="waterfall" id="waterfall"></main>

<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
  <img id="lbImg" alt="图片预览">
  <div class="lb-status" id="lbStatus"></div>
  <div class="lb-bar">
    <button type="button" class="primary" id="lbCopy">复制原图</button>
    <button type="button" id="lbOpen">新标签打开</button>
    <button type="button" id="lbClose">关闭</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

  "生成的视频 (3).gif.crdownload.gif",
  "生成的视频 (4).gif",
  "生成的视频 (5)-2.gif",
  "生成的视频 (5).gif",
  "生成的视频 (6).gif",
  "生成的视频 (7).gif",
  "生成的视频 (8).gif",
  "生成的视频 (9).gif",
  "生成的视频-2.gif",
  "生成的视频-3.gif",
  "生成的视频.gif",
  "电死你.jpg",
  "疯狂电猪.gif",
  "祥子偷走外卖.gif",
  "第一天打卡.gif",
  "胖.jpg",
  "被（烧猪）群友包围了，好幸福.jpg",
  "被（猪）群友包围了，好幸福.png",
  "让我摸下你的鸟.gif",
  "这奶子怎么这么小.jpg",
  "魔法未来10th.png",
  "魔法未来1th.jpeg",
  "黄色的怪兽.gif"
  ];

  var MINI_SUFFIX = '__mini';                       // 缩略图后缀
  var ANIM_EXT    = /^(GIF|APNG|WEBP)$/;            // 视为“动图”高亮的格式

  /* ========================= DOM ========================= */
  var waterfall = document.getElementById('waterfall');
  var countEl   = document.getElementById('count');
  var lightbox  = document.getElementById('lightbox');
  var lbImg     = document.getElementById('lbImg');
  var lbStatus  = document.getElementById('lbStatus');
  var lbCopy    = document.getElementById('lbCopy');
  var lbOpen    = document.getElementById('lbOpen');
  var lbClose   = document.getElementById('lbClose');
  var toastEl   = document.getElementById('toast');

  var currentSrc   = '';   // 灯箱当前原图
  var currentThumb = '';   // 灯箱当前缩略图
  var lbToken      = 0;    // 防止快速切换时旧回调覆盖

  countEl.textContent = images.length ? images.length + ' 张' : '暂无图片';

  /* ============== 工具：生成缩略图地址 ============== */
  /**
   * a.gif        -> a__mini.gif
   * a.gif?v=1    -> a__mini.gif?v=1
   * a/b.jpeg#x   -> a/b__mini.jpeg#x
   */
  function miniUrl(src) {
    var i = src.search(/[?#]/);
    var base = i > -1 ? src.slice(0, i) : src;
    var rest = i > -1 ? src.slice(i) : '';

    var slash = base.lastIndexOf('/');
    var dot   = base.lastIndexOf('.');
    if (dot > slash + 1) {                       // 存在扩展名
      return base.slice(0, dot) + MINI_SUFFIX + base.slice(dot) + rest;
    }
    return base + MINI_SUFFIX + rest;            // 无扩展名兜底
  }

  /* ============== 工具：解析图片格式 ============== */
  function extOf(src) {
    var i = src.search(/[?#]/);
    var base = i > -1 ? src.slice(0, i) : src;

    var slash = base.lastIndexOf('/');
    var dot   = base.lastIndexOf('.');
    if (dot > slash + 1) {
      var ext = base.slice(dot + 1).toLowerCase();
      if (/^[a-z0-9]{1,6}$/.test(ext)) return ext.toUpperCase();
    }
    return '';                                   // 无扩展名则不显示徽章
  }

  /* ==================== 1) 渲染瀑布流 ==================== */
  var frag = document.createDocumentFragment();

  images.forEach(function (src, i) {
    var thumb = miniUrl(src);

    var card = document.createElement('figure');
    card.className = 'card';

    /* ---- 左上角格式徽章 ---- */
    var fmt = extOf(src);
    if (fmt) {
      var badge = document.createElement('span');
      badge.className = 'fmt-badge' + (ANIM_EXT.test(fmt) ? ' is-anim' : '');
      badge.textContent = fmt;
      badge.title = '格式：' + fmt;
      card.appendChild(badge);
    }

    /* ---- 缩略图 ---- */
    var img = document.createElement('img');
    img.alt = '图片 ' + (i + 1);
    img.loading = 'lazy';        // 懒加载，首屏极快
    img.decoding = 'async';      // 异步解码，不阻塞主线程
    img.draggable = false;
    img.referrerPolicy = 'no-referrer';

    img.addEventListener('load', function () {
      card.classList.add('loaded');
    });

    img.addEventListener('error', function () {
      // 缩略图缺失时自动回退到原图，再失败才标记错误
      if (img.dataset.fallback === '1') {
        card.classList.add('loaded', 'failed');
        return;
      }
      img.dataset.fallback = '1';
      img.src = src;
    });

    img.src = thumb;             // 首页只请求缩略图

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy-btn';
    btn.textContent = '复制';
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      copyImage(src, btn);       // 复制始终是原图
    });

    card.appendChild(img);
    card.appendChild(btn);

    card.addEventListener('click', function () {
      openLightbox(src, thumb);
    });

    // 悬停时静默预取原图，点开通常瞬间完成
    card.addEventListener('mouseenter', function () {
      preload(src);
    }, { once: true });

    frag.appendChild(card);
  });

  waterfall.appendChild(frag);   // 一次性插入，减少重排

  /* ==================== 2) 原图预取 ==================== */
  var preloaded = Object.create(null);
  function preload(src) {
    if (preloaded[src]) return;
    preloaded[src] = true;
    var im = new Image();
    im.decoding = 'async';
    im.src = src;
  }

  /* ==================== 3) 灯箱 ==================== */
  function openLightbox(src, thumb) {
    currentSrc   = src;
    currentThumb = thumb;
    var token = ++lbToken;

    delete lbImg.dataset.fallback;   // 重置回退标记
    lbStatus.textContent = '';
    lbImg.src = thumb;               // 先用缩略图顶上，秒开

    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.documentElement.style.overflow = 'hidden';

    // 后台加载原图，完成后无缝替换
    var full = new Image();
    full.decoding = 'async';
    full.onload = function () {
      if (token !== lbToken) return;  // 已切换到别的图，丢弃
      lbImg.src = src;
      lbStatus.textContent = '';
    };
    full.onerror = function () {
      if (token !== lbToken) return;
      lbStatus.textContent = '原图加载失败，当前为缩略图';
    };
    lbStatus.textContent = '高清原图加载中…';
    full.src = src;
  }

  function closeLightbox() {
    if (!lightbox.classList.contains('open')) return;
    lbToken++;                        // 让未完成的加载回调失效
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.documentElement.style.overflow = '';
    setTimeout(function () {
      if (!lightbox.classList.contains('open')) lbImg.removeAttribute('src');
    }, 320);
  }

  lbClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeLightbox();
  });
  lbOpen.addEventListener('click', function () {
    if (currentSrc) window.open(currentSrc, '_blank', 'noopener');
  });
  lbCopy.addEventListener('click', function () {
    if (currentSrc) copyImage(currentSrc, lbCopy);   // 复制原图
  });

  // 缩略图本身也打不开时，直接回退到原图
  lbImg.addEventListener('error', function () {
    if (lbImg.dataset.fallback === '1') return;
    lbImg.dataset.fallback = '1';
    if (currentSrc) lbImg.src = currentSrc;
  });

  /* ==================== 4) 复制图片（原图） ==================== */
  function copyImage(src, btn) {
    var label = btn.dataset.label || btn.textContent;
    btn.dataset.label = label;
    btn.disabled = true;
    btn.textContent = '复制中…';

    getPngBlob(src).then(function (blob) {
      if (!navigator.clipboard || typeof window.ClipboardItem === 'undefined') {
        throw new Error('当前浏览器不支持剪贴板写入');
      }
      return navigator.clipboard.write([
        new ClipboardItem({ 'image/png': blob })
      ]);
    }).then(function () {
      btn.textContent = '✓ 已复制';
      toast('✅ 原图已复制到剪贴板');
    }).catch(function (err) {
      console.warn('[copy]', err);
      btn.textContent = '复制失败';
      toast('❌ 复制失败，可右键图片另存为');
    }).then(function () {
      btn.disabled = false;
      setTimeout(function () { btn.textContent = label; }, 1400);
    });
  }

  /**
   * 取到 PNG Blob：
   *  1) 优先 fetch 原始数据（同源 / 有 CORS 头时最快，且命中缓存不重复下载）
   *  2) 非 PNG 格式（jpg/gif/webp…）用 canvas 转 PNG ——
   *     剪贴板多数浏览器只认 image/png，GIF 会取第一帧
   */
  function getPngBlob(src) {
    var raw = null;

    return fetch(src, { mode: 'cors', credentials: 'omit', cache: 'force-cache' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.blob();
      })
      .then(function (blob) { raw = blob; })
      .catch(function () { raw = null; })     // 跨域无 CORS 头时走兜底
      .then(function () {
        if (raw && raw.type === 'image/png') return raw;

        var objectUrl = null;
        if (raw && raw.size) objectUrl = URL.createObjectURL(raw);

        return drawToPng(objectUrl || src).then(function (png) {
          if (objectUrl) URL.revokeObjectURL(objectUrl);
          return png;
        }, function (e) {
          if (objectUrl) URL.revokeObjectURL(objectUrl);
          throw e;
        });
      });
  }

  function drawToPng(src) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.decoding = 'async';

      img.onload = function () {
        try {
          var w = img.naturalWidth || img.width;
          var h = img.naturalHeight || img.height;
          if (!w || !h) throw new Error('图片尺寸异常');

          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0);

          canvas.toBlob(function (blob) {
            blob ? resolve(blob) : reject(new Error('toBlob 返回空'));
          }, 'image/png');
        } catch (e) {
          reject(e);   // 画布被跨域污染时会走到这里
        }
      };

      img.onerror = function () { reject(new Error('图片加载失败')); };
      img.src = src;
    });
  }

  /* ==================== 5) Toast ==================== */
  var toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 1800);
  }

})();
</script>
</body>
