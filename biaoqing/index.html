<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf6ee">
<title>表情图片展示</title>
<style>
  :root{
    --bg:#fdf6ee;
    --text:#4a3b2f;
    --muted:#a99078;
    --accent:#ff8a3d;
    --line:rgba(190,150,110,.18);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    min-height:100vh;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 520px at 6% -10%, #ffe9d2 0%, rgba(255,233,210,0) 60%),
      radial-gradient(820px 480px at 104% 0%, #ffe1d1 0%, rgba(255,225,209,0) 55%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 顶栏 ---------- */
  .header{
    position:sticky;top:0;z-index:30;
    background:rgba(253,246,238,.86);
    -webkit-backdrop-filter:blur(12px);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:1280px;margin:0 auto;
    padding:11px 18px;
    display:flex;align-items:center;gap:10px;
  }
  .logo{font-size:18px;line-height:1;}
  .header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.3px;}
  .count{
    font-size:12px;color:var(--accent);
    background:rgba(255,138,61,.12);
    padding:2px 9px;border-radius:999px;
  }
  .hint{margin-left:auto;font-size:12px;color:var(--muted);}
  @media (max-width:520px){ .hint{display:none;} }

  /* ---------- 分类切换 ---------- */
  .tabs{
    max-width:1280px;margin:0 auto;
    padding:14px 18px 0;
    display:flex;flex-wrap:wrap;gap:8px;
  }
  .tab{
    border:1px solid var(--line);
    background:rgba(255,255,255,.55);
    color:var(--muted);
    padding:7px 16px;
    border-radius:999px;
    font:inherit;font-size:13px;
    cursor:pointer;
    transition:background .2s,color .2s,border-color .2s,box-shadow .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .tab:hover{background:rgba(255,255,255,.9);color:var(--text);}
  .tab.active{
    background:var(--accent);
    border-color:transparent;
    color:#fff;
    box-shadow:0 2px 10px rgba(220,120,50,.35);
  }

  /* ---------- 瀑布流 ---------- */
  .waterfall{
    max-width:1280px;margin:0 auto;
    padding:14px 18px 60px;
    column-width:170px;
    column-gap:12px;
  }
  .card{
    break-inside:avoid;
    -webkit-column-break-inside:avoid;
    page-break-inside:avoid;
    position:relative;
    margin:0 0 12px;
    border-radius:14px;
    overflow:hidden;
    cursor:zoom-in;
    min-height:80px;
    background:linear-gradient(100deg,#f3e7d8 30%,#f9f1e6 50%,#f3e7d8 70%);
    background-size:200% 100%;
    animation:shimmer 1.4s linear infinite;
    box-shadow:0 2px 10px rgba(180,130,80,.12);
    transition:transform .22s ease, box-shadow .22s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .card.loaded{animation:none;background:#f3e7d8;}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(180,130,80,.24);}
  @keyframes shimmer{to{background-position:-200% 0;}}

  .card img{
    display:block;width:100%;height:auto;
    opacity:0;
    transition:opacity .35s ease;
    -webkit-user-drag:none;user-select:none;
  }
  .card.loaded img{opacity:1;}
  .card.failed{min-height:80px;}
  .card.failed img{display:none;}
  .card.failed::after{
    content:"图片加载失败";
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;color:var(--muted);
  }

  /* ---------- 左上角格式徽章 ---------- */
  .fmt-badge{
    position:absolute;top:8px;left:8px;z-index:2;
    font-size:10.5px;font-weight:700;
    line-height:1;letter-spacing:.6px;
    padding:5px 8px;border-radius:7px;
    color:#fff;
    background:rgba(74,59,47,.58);
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
    pointer-events:none;
    user-select:none;
    box-shadow:0 1px 4px rgba(0,0,0,.12);
  }
  .fmt-badge.is-anim{
    background:rgba(255,138,61,.95);
    box-shadow:0 2px 8px rgba(220,120,50,.4);
  }

  .copy-btn{
    position:absolute;top:8px;right:8px;z-index:2;
    border:0;border-radius:999px;
    padding:6px 12px;
    font:inherit;font-size:12px;line-height:1;
    color:#fff;background:rgba(255,138,61,.94);
    cursor:pointer;
    opacity:0;transform:translateY(-4px);
    transition:opacity .2s ease, transform .2s ease, background .2s;
    box-shadow:0 2px 8px rgba(220,120,50,.35);
  }
  .copy-btn:hover{background:#f4762a;}
  .copy-btn:disabled{cursor:default;opacity:.85;}
  .card:hover .copy-btn,
  .card:focus-within .copy-btn{opacity:1;transform:translateY(0);}
  @media (hover:none){
    .copy-btn{opacity:1;transform:none;}
  }

  /* ---------- 灯箱 ---------- */
  .lightbox{
    position:fixed;inset:0;z-index:100;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:14px;padding:24px;
    background:rgba(44,30,20,.74);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    opacity:0;visibility:hidden;
    transition:opacity .22s ease, visibility .22s;
  }
  .lightbox.open{opacity:1;visibility:visible;}
  .lightbox img{
    max-width:92vw;
    max-height:calc(100vh - 190px);
    max-height:calc(100dvh - 190px);
    object-fit:contain;
    border-radius:12px;
    background:#fff;
    box-shadow:0 24px 64px rgba(0,0,0,.45);
    transform:scale(.94);
    transition:transform .26s cubic-bezier(.2,.8,.3,1);
  }
  .lightbox.open img{transform:scale(1);}
  .lb-status{
    font-size:12px;color:rgba(255,255,255,.72);
    min-height:16px;letter-spacing:.3px;
    text-align:center;
  }
  .lb-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .lb-bar button{
    font:inherit;font-size:13px;
    padding:9px 18px;border-radius:999px;
    border:1px solid rgba(255,255,255,.28);
    background:rgba(255,255,255,.14);
    color:#fff;cursor:pointer;
    transition:background .2s,border-color .2s;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }
  .lb-bar button:hover{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.5);}
  .lb-bar button:disabled{opacity:.6;cursor:default;}
  .lb-bar .primary{background:rgba(255,138,61,.92);border-color:transparent;}
  .lb-bar .primary:hover{background:#f4762a;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:34px;
    transform:translate(-50%,16px);
    z-index:200;
    background:rgba(58,42,30,.94);
    color:#fff;font-size:13px;
    padding:10px 20px;border-radius:999px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  .empty-tip{
    padding:60px 20px;text-align:center;color:var(--muted);font-size:14px;
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <span class="logo">😄</span>
    <h1>表情图片展示</h1>
    <span class="count" id="count"></span>
    <span class="hint">点击看原图 · 悬停复制</span>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="分类切换"></nav>

<main class="waterfall" id="waterfall"></main>

<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
  <img id="lbImg" alt="图片预览">
  <div class="lb-status" id="lbStatus"></div>
  <div class="lb-bar">
    <button type="button" class="primary" id="lbCopy">复制原图</button>
    <button type="button" id="lbOpen">新标签打开</button>
    <button type="button" id="lbClose">关闭</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 数据文件：与页面同目录，负责提供分类与图片列表 -->
<script src="data.js"></script>

<script>
(function () {
  'use strict';

  /* =========================================================
   *  配置
   * ========================================================= */
  var MINI_SUFFIX = '__mini';                       // 缩略图后缀
  var ANIM_EXT    = /^(GIF|APNG|WEBP)$/;            // 视为"动图"高亮的格式

  /* ========================= DOM ========================= */
  var tabsEl    = document.getElementById('tabs');
  var waterfall = document.getElementById('waterfall');
  var countEl   = document.getElementById('count');
  var lightbox  = document.getElementById('lightbox');
  var lbImg     = document.getElementById('lbImg');
  var lbStatus  = document.getElementById('lbStatus');
  var lbCopy    = document.getElementById('lbCopy');
  var lbOpen    = document.getElementById('lbOpen');
  var lbClose   = document.getElementById('lbClose');
  var toastEl   = document.getElementById('toast');

  var currentSrc   = '';
  var lbToken      = 0;

  /* ==================== 0) 读取并整理数据 ==================== */
  var data = window.GALLERY_DATA;

  if (!data || !Array.isArray(data.categories) || !data.categories.length) {
    waterfall.innerHTML = '<p class="empty-tip">数据加载失败：请确认 data.js 与页面在同一目录，且 window.GALLERY_DATA 格式正确。</p>';
    return;
  }

  var categories = resolveCategories(data);
  var currentIndex = clampIndex(data.defaultIndex, categories.length);

  /* ==================== 1) 分类解析 ==================== */
  /**
   * 支持 all: true 的分类自动合并其他分类的图片（去重、保持首次出现顺序）
   */
  function resolveCategories(raw) {
    var list = raw.categories;

    var pool = [];
    var seen = Object.create(null);
    list.forEach(function (c) {
      if (c && c.all !== true && Array.isArray(c.images)) {
        c.images.forEach(function (src) {
          if (typeof src === 'string' && src && !seen[src]) {
            seen[src] = true;
            pool.push(src);
          }
        });
      }
    });

    return list.map(function (c) {
      var name = (c && c.name) ? String(c.name) : '未命名';
      if (c && c.all === true) {
        return { name: name, images: pool.slice() };
      }
      var imgs = (c && Array.isArray(c.images)) ? c.images.filter(function (x) {
        return typeof x === 'string' && x;
      }) : [];
      return { name: name, images: imgs };
    });
  }

  function clampIndex(idx, len) {
    idx = parseInt(idx, 10);
    if (isNaN(idx) || idx < 0) return 0;
    if (idx >= len) return len - 1;
    return idx;
  }

  /* ============== 工具：生成缩略图地址 ============== */
  function miniUrl(src) {
    var i = src.search(/[?#]/);
    var base = i > -1 ? src.slice(0, i) : src;
    var rest = i > -1 ? src.slice(i) : '';

    var slash = base.lastIndexOf('/');
    var dot   = base.lastIndexOf('.');
    if (dot > slash + 1) {
      return base.slice(0, dot) + MINI_SUFFIX + base.slice(dot) + rest;
    }
    return base + MINI_SUFFIX + rest;
  }

  /* ============== 工具：解析图片格式 ============== */
  function extOf(src) {
    var i = src.search(/[?#]/);
    var base = i > -1 ? src.slice(0, i) : src;

    var slash = base.lastIndexOf('/');
    var dot   = base.lastIndexOf('.');
    if (dot > slash + 1) {
      var ext = base.slice(dot + 1).toLowerCase();
      if (/^[a-z0-9]{1,6}$/.test(ext)) return ext.toUpperCase();
    }
    return '';
  }

  /* ==================== 2) 渲染分类切换栏 ==================== */
  function renderTabs() {
    tabsEl.innerHTML = '';
    categories.forEach(function (cat, i) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tab' + (i === currentIndex ? ' active' : '');
      btn.textContent = cat.name;
      btn.setAttribute('data-index', i);
      btn.addEventListener('click', function () {
        if (i === currentIndex) return;
        currentIndex = i;
        updateActiveTab();
        renderGallery();
      });
      tabsEl.appendChild(btn);
    });
  }

  function updateActiveTab() {
    var btns = tabsEl.children;
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', i === currentIndex);
    }
  }

  /* ==================== 3) 渲染瀑布流 ==================== */
  function renderGallery() {
    closeLightbox();                       // 切换分类时关闭灯箱

    var cat = categories[currentIndex];
    var images = cat.images;

    countEl.textContent = images.length ? images.length + ' 张' : '暂无图片';

    waterfall.innerHTML = '';

    if (!images.length) {
      waterfall.innerHTML = '<p class="empty-tip">这个分类还没有图片～</p>';
      return;
    }

    var frag = document.createDocumentFragment();

    images.forEach(function (src, i) {
      var thumb = miniUrl(src);

      var card = document.createElement('figure');
      card.className = 'card';

      /* ---- 左上角格式徽章 ---- */
      var fmt = extOf(src);
      if (fmt) {
        var badge = document.createElement('span');
        badge.className = 'fmt-badge' + (ANIM_EXT.test(fmt) ? ' is-anim' : '');
        badge.textContent = fmt;
        badge.title = '格式：' + fmt;
        card.appendChild(badge);
      }

      /* ---- 缩略图 ---- */
      var img = document.createElement('img');
      img.alt = cat.name + ' 图片 ' + (i + 1);
      img.loading = 'lazy';
      img.decoding = 'async';
      img.draggable = false;
      img.referrerPolicy = 'no-referrer';

      img.addEventListener('load', function () {
        card.classList.add('loaded');
      });

      img.addEventListener('error', function () {
        if (img.dataset.fallback === '1') {
          card.classList.add('loaded', 'failed');
          return;
        }
        img.dataset.fallback = '1';
        img.src = src;
      });

      img.src = thumb;

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'copy-btn';
      btn.textContent = '复制';
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        copyImage(src, btn);
      });

      card.appendChild(img);
      card.appendChild(btn);

      card.addEventListener('click', function () {
        openLightbox(src, thumb);
      });

      card.addEventListener('mouseenter', function () {
        preload(src);
      }, { once: true });

      frag.appendChild(card);
    });

    waterfall.appendChild(frag);
  }

  /* ==================== 4) 原图预取 ==================== */
  var preloaded = Object.create(null);
  function preload(src) {
    if (preloaded[src]) return;
    preloaded[src] = true;
    var im = new Image();
    im.decoding = 'async';
    im.src = src;
  }

  /* ==================== 5) 灯箱 ==================== */
  function openLightbox(src, thumb) {
    currentSrc = src;
    var token = ++lbToken;

    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.documentElement.style.overflow = 'hidden';

    var useThumb = thumb && thumb !== src;

    lbImg.onload  = null;
    lbImg.onerror = null;
    lbImg.removeAttribute('src');

    if (useThumb) {
      lbImg.onerror = function () {
        lbImg.onerror = null;
        lbImg.removeAttribute('src');
        lbStatus.textContent = '缩略图加载失败，原图加载中…';
      };
      lbImg.src = thumb;
      lbStatus.textContent = '原图加载中…';
    } else {
      lbStatus.textContent = '加载中…';
    }

    var full = new Image();
    full.decoding = 'async';
    full.onload = function () {
      if (token !== lbToken) return;
      lbImg.onload  = null;
      lbImg.onerror = null;
      lbImg.src = src;
      lbStatus.textContent = '';
    };
    full.onerror = function () {
      if (token !== lbToken) return;
      lbImg.onerror = null;
      var showingThumb = useThumb && lbImg.getAttribute('src') === thumb;
      if (showingThumb) {
        lbStatus.textContent = '原图加载失败，显示缩略图';
      } else {
        lbImg.removeAttribute('src');
        lbStatus.textContent = '图片加载失败';
      }
    };
    full.src = src;
  }

  function closeLightbox() {
    if (!lightbox.classList.contains('open')) return;
    lbToken++;
    lbImg.onload  = null;
    lbImg.onerror = null;
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.documentElement.style.overflow = '';
    setTimeout(function () {
      if (!lightbox.classList.contains('open')) lbImg.removeAttribute('src');
    }, 320);
  }

  lbClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeLightbox();
  });
  lbOpen.addEventListener('click', function () {
    if (currentSrc) window.open(currentSrc, '_blank', 'noopener');
  });
  lbCopy.addEventListener('click', function () {
    if (currentSrc) copyImage(currentSrc, lbCopy);
  });

  /* ==================== 6) 复制原图 ==================== */
  function copyImage(src, btn) {
    var label = btn.dataset.label || btn.textContent;
    btn.dataset.label = label;
    btn.disabled = true;
    btn.textContent = '复制中…';

    getPngBlob(src).then(function (blob) {
      if (!navigator.clipboard || typeof window.ClipboardItem === 'undefined') {
        throw new Error('当前浏览器不支持剪贴板写入');
      }
      return navigator.clipboard.write([
        new ClipboardItem({ 'image/png': blob })
      ]);
    }).then(function () {
      btn.textContent = '✓ 已复制';
      toast('✅ 原图已复制到剪贴板');
    }).catch(function (err) {
      console.warn('[copy]', err);
      btn.textContent = '复制失败';
      toast('❌ 复制失败，可右键图片另存为');
    }).then(function () {
      btn.disabled = false;
      setTimeout(function () { btn.textContent = label; }, 1400);
    });
  }

  function getPngBlob(src) {
    var raw = null;

    return fetch(src, { mode: 'cors', credentials: 'omit', cache: 'force-cache' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.blob();
      })
      .then(function (blob) { raw = blob; })
      .catch(function () { raw = null; })
      .then(function () {
        if (raw && raw.type === 'image/png') return raw;

        var objectUrl = null;
        if (raw && raw.size) objectUrl = URL.createObjectURL(raw);

        return drawToPng(objectUrl || src).then(function (png) {
          if (objectUrl) URL.revokeObjectURL(objectUrl);
          return png;
        }, function (e) {
          if (objectUrl) URL.revokeObjectURL(objectUrl);
          throw e;
        });
      });
  }

  function drawToPng(src) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.decoding = 'async';

      img.onload = function () {
        try {
          var w = img.naturalWidth || img.width;
          var h = img.naturalHeight || img.height;
          if (!w || !h) throw new Error('图片尺寸异常');

          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0);

          canvas.toBlob(function (blob) {
            blob ? resolve(blob) : reject(new Error('toBlob 返回空'));
          }, 'image/png');
        } catch (e) {
          reject(e);
        }
      };

      img.onerror = function () { reject(new Error('图片加载失败')); };
      img.src = src;
    });
  }

  /* ==================== 7) Toast ==================== */
  var toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 1800);
  }

  /* ==================== 8) 启动 ==================== */
  renderTabs();
  renderGallery();

})();
</script>
</body>
</html>
