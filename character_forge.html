<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小说角色生成器 · Character Forge</title>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:#f0f3f9;color:#2a3140;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#ccd6e6;border-radius:5px;}
  ::-webkit-scrollbar-thumb:hover{background:#aebbd0;}
  ::-webkit-scrollbar-track{background:transparent;}

  .app{display:flex;flex-direction:column;height:100vh;}

  header{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 18px;background:#fff;border-bottom:1px solid #e2e8f2;
    box-shadow:0 1px 4px rgba(30,50,90,.05);position:relative;z-index:6;
  }
  header h1{
    margin:0;font-size:16px;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(90deg,#4f7df3,#8b5cf6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    white-space:nowrap;
  }
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  select,.toolbar button{
    background:#fff;border:1px solid #d8e0ec;color:#3a4258;
    padding:7px 12px;border-radius:8px;font-size:13px;transition:.15s;
  }
  .toolbar button:hover{border-color:#4f7df3;background:#f6f9ff;color:#2b5bd6;}
  .toolbar button.primary{
    background:linear-gradient(135deg,#4f7df3,#8b5cf6);border-color:transparent;
    color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(79,125,243,.32);
  }
  .toolbar button.primary:hover{filter:brightness(1.08);color:#fff;}
  .toolbar button.ghost{color:#9aa3b8;}
  .toolbar .sep{width:1px;height:20px;background:#e2e8f2;}

  .body{flex:1;display:flex;min-height:0;}
  .sidebar{
    width:252px;min-width:252px;border-right:1px solid #e2e8f2;
    display:flex;flex-direction:column;background:#fff;
  }
  .side-title{
    padding:12px 16px;font-size:12px;color:#8a93a8;letter-spacing:1px;
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid #eef2f8;
  }
  #charCount{background:#eef2fb;color:#5a6b8c;border-radius:10px;padding:1px 8px;font-size:11px;}
  .char-list{flex:1;overflow-y:auto;padding:8px;}
  .char-item{
    display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;
    cursor:pointer;transition:.15s;border:1px solid transparent;margin-bottom:4px;
  }
  .char-item:hover{background:#f4f7fd;}
  .char-item.active{background:#eaf1ff;border-color:#b9d0fb;}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .ci-main{min-width:0;flex:1;}
  .ci-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2a3140;}
  .ci-sub{font-size:11px;color:#8a93a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}

  main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .tabs{
    display:flex;align-items:center;gap:6px;padding:8px 14px;
    border-bottom:1px solid #e2e8f2;background:#fff;
  }
  .tab{
    background:transparent;border:1px solid transparent;color:#8a93a8;
    padding:6px 14px;border-radius:8px;font-size:13px;transition:.15s;font-weight:500;
  }
  .tab:hover{color:#3a4258;background:#f4f7fd;}
  .tab.active{background:#eaf1ff;color:#2b5bd6;border-color:#c3d8fb;}
  .tabs .spacer{flex:1;}
  .graph-tools{display:flex;gap:6px;}
  .graph-tools button{
    background:#fff;border:1px solid #d8e0ec;color:#6b7790;
    padding:5px 10px;border-radius:7px;font-size:12px;transition:.15s;
  }
  .graph-tools button:hover{border-color:#4f7df3;color:#2b5bd6;background:#f6f9ff;}

  .pane-wrap{flex:1;position:relative;min-height:0;background:#f7f9fd;}
  .pane{position:absolute;inset:0;overflow:auto;padding:20px 24px 70px;}
  #graphPane{padding:0;overflow:hidden;}
  .hidden{display:none !important;}

  .empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;color:#9aa3b8;gap:10px;font-size:14px;
  }
  .empty .big{font-size:40px;opacity:.4;}

  .detail-head{
    display:flex;gap:14px;align-items:flex-start;
    padding-bottom:16px;border-bottom:1px solid #e6ecf5;margin-bottom:18px;
  }
  .avatar{
    width:56px;height:56px;border-radius:14px;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:800;color:#1f2733;
  }
  .detail-head .info{flex:1;min-width:0;}
  .big-input{
    background:transparent;border:none;border-bottom:1px dashed #d8e0ec;
    color:#1f2733;font-size:22px;font-weight:800;padding:2px 0;width:100%;
    font-family:inherit;transition:.15s;
  }
  .big-input:focus{outline:none;border-bottom-color:#4f7df3;}
  .detail-head .sub{font-size:12.5px;color:#8a93a8;margin-top:6px;}
  .head-actions{display:flex;gap:8px;flex:none;}
  .head-actions button{
    background:#fff;border:1px solid #d8e0ec;color:#6b7790;
    padding:7px 12px;border-radius:8px;font-size:12.5px;transition:.15s;
  }
  .head-actions button:hover{border-color:#4f7df3;color:#2b5bd6;background:#f6f9ff;}
  .head-actions button.danger:hover{border-color:#f08a90;color:#d8404a;background:#fff6f6;}

  .fgroup{margin-bottom:22px;}
  .fgroup h3{
    margin:0 0 10px;font-size:12px;letter-spacing:2px;color:#93a0b8;
    font-weight:700;display:flex;align-items:center;gap:8px;
  }
  .fgroup h3::after{content:'';flex:1;height:1px;background:#e6ecf5;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
  @media(max-width:980px){.grid{grid-template-columns:1fr;}}

  .field{display:flex;flex-direction:column;gap:5px;font-size:12px;min-width:0;}
  .field>span.fl{color:#8a93a8;letter-spacing:.5px;}
  .field.wide{grid-column:1/-1;}
  .input-row{display:flex;gap:6px;align-items:flex-start;}
  .input-row input,.input-row textarea{
    flex:1;min-width:0;
    background:#fff;border:1px solid #dde4ee;border-radius:7px;
    color:#2a3140;padding:7px 9px;font:inherit;font-size:13px;
    resize:vertical;transition:.15s;width:100%;
  }
  .input-row input:focus,.input-row textarea:focus{
    outline:none;border-color:#6b9af8;box-shadow:0 0 0 3px rgba(79,125,243,.13);
  }
  .input-row input[type=number]{
    text-align:center;font-weight:600;color:#2b5bd6;
  }
  .mini{
    flex:none;width:32px;height:33px;border-radius:7px;
    background:#f2f5fb;border:1px solid #dde4ee;color:#7a869c;
    font-size:13px;display:flex;align-items:center;justify-content:center;
    transition:.15s;padding:0;
  }
  .mini:hover{background:#e8effc;border-color:#9fc0f5;color:#2b5bd6;}
  .flash{animation:flashIn .5s;}
  @keyframes flashIn{0%{background:#fff7e0;border-color:#f0bf4a;}100%{background:#fff;}}

  .field-hint{
    font-size:11.5px;color:#8a93a8;margin-top:5px;
    padding:5px 9px;border-radius:7px;background:#f6f9fe;
    border:1px solid #e8eef8;transition:.15s;line-height:1.45;
  }
  .field-hint.low{background:#eef5ff;border-color:#c9ddfb;color:#3a6fe0;}
  .field-hint.ok{background:#eefbf1;border-color:#c9ecd3;color:#2a8f4d;}
  .field-hint.warn{background:#fff8e8;border-color:#f5e0af;color:#b8860b;}
  .field-hint.bad{background:#fff0f0;border-color:#f5c8cc;color:#d8404a;}

  .field-hint.mbti-analyst { background:#f4f0ff; border-color:#ddd0f8; color:#6b4dbf; }
  .field-hint.mbti-diplomat{ background:#eefaf3; border-color:#c9ecd8; color:#2a8f5e; }
  .field-hint.mbti-guardian{ background:#eef4ff; border-color:#c9dcfb; color:#3a6fe0; }
  .field-hint.mbti-explorer{ background:#fff9e8; border-color:#f5e0af; color:#b8860b; }

  .pool-pop{
    display:flex;flex-wrap:wrap;gap:6px;padding:9px;
    background:#f6f9fe;border:1px solid #e3eaf5;border-radius:9px;margin-top:2px;
    max-height:220px;overflow-y:auto;
  }
  .pool-tag{
    background:#fff;border:1px solid #dde4ee;border-radius:14px;
    padding:3px 10px;font-size:12px;color:#4a5568;cursor:pointer;transition:.12s;
    white-space:nowrap;
  }
  .pool-tag:hover{background:#eaf1ff;border-color:#9fc0f5;color:#2b5bd6;}
  .pool-tag.on{background:#4f7df3;border-color:#4f7df3;color:#fff;}
  .pool-tag small{font-size:11px;opacity:.65;margin-left:3px;}
  .pool-tag.on small{opacity:.9;}

  .radar-field{grid-column:1/-1;}
  .radar-wrap{
    display:flex;justify-content:center;align-items:center;
    background:#fff;border:1px solid #e3eaf5;border-radius:12px;padding:6px;
  }
  .radar-svg{max-width:100%;height:auto;display:block;}

  .rel-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .rel-item{
    display:flex;align-items:center;gap:8px;padding:8px 10px;
    background:#fff;border:1px solid #e3eaf5;border-radius:9px;font-size:13px;
  }
  .rel-item .dir{color:#a8b2c4;font-size:12px;flex:none;}
  .rel-item .who{font-weight:600;color:#2a3140;}
  .rel-item .rtype{
    font-size:11px;padding:2px 8px;border-radius:20px;
    background:#eaf1ff;color:#3a6fe0;flex:none;
  }
  .rel-item .rdesc{flex:1;color:#8a93a8;font-size:12px;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rel-item .del{
    background:transparent;border:none;color:#b6bfd0;font-size:16px;
    line-height:1;padding:2px 6px;border-radius:5px;
  }
  .rel-item .del:hover{color:#d8404a;background:#fff0f0;}
  .rel-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .rel-add select,.rel-add input{
    background:#fff;border:1px solid #dde4ee;color:#3a4258;
    padding:7px 9px;border-radius:7px;font-size:13px;font-family:inherit;
  }
  .rel-add input{flex:1;min-width:150px;}
  .rel-add select:focus,.rel-add input:focus{outline:none;border-color:#6b9af8;}
  .rel-add button{
    background:#eaf1ff;border:1px solid #c3d8fb;color:#2b5bd6;
    padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;
  }
  .rel-add button:hover{background:#dbe7ff;}

  .faction-intro{
    font-size:12.5px;color:#8a93a8;margin-bottom:16px;
    display:flex;align-items:center;gap:8px;
  }
  .faction-intro .num{
    background:#eaf1ff;color:#2b5bd6;border-radius:10px;
    padding:1px 9px;font-weight:600;
  }
  .faction-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:14px;align-items:start;
  }
  @media(max-width:700px){.faction-grid{grid-template-columns:1fr;}}
  .faction-card{
    background:#fff;border:1px solid #e3eaf5;border-radius:13px;
    padding:15px 16px 14px;transition:.15s;position:relative;overflow:hidden;
  }
  .faction-card::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(180deg,#4f7df3,#8b5cf6);opacity:.75;
  }
  .faction-card:hover{border-color:#c3d8fb;box-shadow:0 6px 18px rgba(30,50,90,.08);}
  .faction-head{
    display:flex;justify-content:space-between;align-items:center;
    gap:10px;margin-bottom:12px;padding-left:6px;
  }
  .faction-name{
    font-size:14.5px;font-weight:800;color:#1f2733;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .faction-count{
    flex:none;font-size:11px;color:#7a869c;background:#f0f4fb;
    padding:2px 9px;border-radius:10px;font-weight:600;
  }
  .faction-members{display:flex;flex-wrap:wrap;gap:7px;padding-left:6px;}
  .member-chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 12px;background:#f6f9fe;border:1px solid #e3eaf5;border-radius:17px;
    font-size:12.5px;color:#3a4258;cursor:pointer;transition:.13s;max-width:100%;
  }
  .member-chip:hover{background:#eaf1ff;border-color:#9fc0f5;color:#2b5bd6;transform:translateY(-1px);}
  .member-chip .dot{width:8px;height:8px;}
  .member-chip .mn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .member-chip.active{background:#eaf1ff;border-color:#6b9af8;color:#2b5bd6;font-weight:600;}

  #graph{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;background:#f7f9fd;}
  #graph:active{cursor:grabbing;}
  .node circle{stroke:#fff;stroke-width:2.5;cursor:pointer;transition:stroke .15s;}
  .node:hover circle{stroke:#4f7df3;stroke-width:3;}
  .node.selected circle{stroke:#f5a623;stroke-width:4;}
  .node text{pointer-events:none;text-anchor:middle;}
  .node-initial{font-size:19px;font-weight:800;fill:#1f2733;}
  .node-name{font-size:12.5px;font-weight:600;fill:#4a5568;}
  .link line{stroke:#c3cddd;stroke-width:1.6;}
  .link-label{
    font-size:11px;fill:#8794ab;text-anchor:middle;
    paint-order:stroke;stroke:#f7f9fd;stroke-width:3.5;stroke-linejoin:round;
    pointer-events:none;
  }

  .node-card{
    position:absolute;width:252px;background:#fff;border:1px solid #dde5f0;
    border-radius:12px;padding:13px 14px;font-size:12.5px;
    box-shadow:0 14px 34px rgba(30,50,90,.16);z-index:20;
    animation:pop .14s ease-out;
  }
  @keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.96);}to{opacity:1;}}
  .node-card .ch{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
  .node-card .ch b{font-size:14.5px;flex:1;color:#1f2733;}
  .node-card .ch .x{
    background:transparent;border:none;color:#b6bfd0;font-size:16px;line-height:1;
    padding:0 3px;
  }
  .node-card .ch .x:hover{color:#d8404a;}
  .node-card .cs{color:#8a93a8;font-size:11.5px;margin-bottom:9px;}
  .node-card .row{display:flex;gap:8px;margin:4px 0;line-height:1.5;}
  .node-card .row>span{color:#9aa3b8;flex:none;width:38px;}
  .node-card .row>div{color:#3a4258;min-width:0;}
  .node-card .actions{margin-top:11px;display:flex;gap:8px;}
  .node-card .actions button{
    flex:1;background:#eaf1ff;border:1px solid #c3d8fb;color:#2b5bd6;
    padding:7px;border-radius:7px;font-size:12.5px;font-weight:500;
  }
  .node-card .actions button:hover{background:#dbe7ff;}

  .hint{
    position:absolute;left:14px;bottom:12px;font-size:11.5px;color:#a8b2c4;
    pointer-events:none;line-height:1.7;
  }

  .toast{
    position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);
    background:#2a3140;color:#fff;padding:10px 22px;border-radius:22px;
    font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:999;
    box-shadow:0 8px 24px rgba(30,50,90,.25);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .toast.err{background:#e0484f;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>✦ 小说角色生成器</h1>
    <div class="toolbar">
      <select id="worldSel"></select>
      <button id="btnGen" class="primary">🎲 随机生成角色</button>
      <button id="btnGen5">+5 个</button>
      <button id="btnLink">🔗 随机关系</button>
      <span class="sep"></span>
      <button id="btnSave" title="保存到浏览器本地">💾 保存</button>
      <button id="btnLoad" title="从浏览器本地读取">📂 读取</button>
      <button id="btnExport" title="导出为 JSON 文件">⬇ 导出</button>
      <button id="btnImport" title="从 JSON 文件导入">⬆ 导入</button>
      <button id="btnClear" class="ghost">清空</button>
    </div>
    <input type="file" id="fileInput" accept=".json,application/json" hidden />
  </header>

  <div class="body">
    <aside class="sidebar">
      <div class="side-title">角色列表 <span id="charCount">0</span></div>
      <div class="char-list" id="charList"></div>
    </aside>

    <main>
      <div class="tabs">
        <button class="tab active" data-tab="detail">角色详情</button>
        <button class="tab" data-tab="graph">关系图</button>
        <button class="tab" data-tab="faction">所属势力</button>
        <div class="spacer"></div>
        <div id="graphTools" class="graph-tools hidden">
          <button data-gt="in">＋ 放大</button>
          <button data-gt="out">－ 缩小</button>
          <button data-gt="reset">重置视图</button>
          <button data-gt="shake">抖动布局</button>
        </div>
      </div>

      <div class="pane-wrap">
        <div class="pane" id="detailPane"></div>
        <div class="pane hidden" id="graphPane">
          <svg id="graph">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
                      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="#b9c4d6"/>
              </marker>
            </defs>
            <g id="view"></g>
          </svg>
          <div id="nodeCard" class="node-card hidden"></div>
          <div class="hint">拖拽节点移动 · 拖拽空白平移 · 滚轮缩放 · 点击节点查看信息</div>
        </div>
        <div class="pane hidden" id="factionPane"></div>
      </div>
    </main>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   小工具
   ========================================================= */
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
function pickN(arr, n){
  const a = arr.slice(), out = [];
  while (out.length < n && a.length) out.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);
  return out;
}
function esc(s){
  return String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* =========================================================
   ★ MBTI 中文释义
   ========================================================= */
const MBTI_CN = {
  INTJ: { name:'建筑师',    desc:'独立、理性、目标导向，擅长长远规划，不太在乎他人眼光' },
  INTP: { name:'逻辑学家',  desc:'热爱思考与拆解，对世界充满好奇，行动力偏弱' },
  ENTJ: { name:'指挥官',    desc:'天生的领导者，果断强势，喜欢掌控全局' },
  ENTP: { name:'辩论家',    desc:'思维敏捷爱抬杠，创意多但容易三分钟热度' },
  INFJ: { name:'提倡者',    desc:'安静而有信念，洞察人心，为理想默默坚持' },
  INFP: { name:'调停者',    desc:'内心柔软，重感情，追求意义，容易自我消耗' },
  ENFJ: { name:'主人公',    desc:'有感染力，善于鼓励他人，常把别人的需要放在前面' },
  ENFP: { name:'竞选者',    desc:'热情、爱自由、点子多，情绪起伏也比较大' },
  ISTJ: { name:'物流师',    desc:'务实、守规矩、可靠，答应的事一定做到' },
  ISFJ: { name:'守卫者',    desc:'温柔细心，默默照顾身边人，不喜欢冲突' },
  ESTJ: { name:'总经理',    desc:'执行力强，讲究秩序和效率，习惯发号施令' },
  ESFJ: { name:'执政官',    desc:'热心、合群，很在意别人的感受和评价' },
  ISTP: { name:'鉴赏家',    desc:'冷静、动手能力强，不爱多话，遇事直接上手' },
  ISFP: { name:'探险家',    desc:'随性、敏感、有审美，不喜欢被束缚' },
  ESTP: { name:'企业家',    desc:'大胆、爱冒险、反应快，享受当下的刺激' },
  ESFP: { name:'表演者',    desc:'热情、爱热闹、享受被关注，情绪外露' },
};
const MBTI_TONE = {

  INFJ:'diplomat', INFP:'diplomat', ENFJ:'diplomat', ENFP:'diplomat',

/* =========================================================
   ★ BMI 相关
   ========================================================= */
function parseHeight(s){
  const m = String(s || '').match(/(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : null;
}
function parseWeight(s){
  const m = String(s || '').match(/(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : null;
}
function bmiInfo(c){
  const h = parseHeight(c.height);
  const w = parseWeight(c.weight);
  if (!h || !w || h <= 0 || w <= 0) return null;
  const hm = h / 100;
  const bmi = w / (hm * hm);
  let label, cls;
  if (bmi < 18.5){ label = '体重不足'; cls = 'low'; }
  else if (bmi < 24){ label = '正常'; cls = 'ok'; }
  else if (bmi < 28){ label = '超重'; cls = 'warn'; }
  else { label = '肥胖'; cls = 'bad'; }
  return { bmi, label, cls, minW: 18.5*hm*hm, maxW: 23.9*hm*hm };
}

function mbtiHintHTML(c){
  const t = String(c.mbti || '').trim().toUpperCase();
  const info = MBTI_CN[t];
  if (!info){
    return `<div class="field-hint" data-hint="mbti">选好类型后，这里会显示通俗解释</div>`;
  }
  const tone = MBTI_TONE[t] || '';
  return `<div class="field-hint mbti-${tone}" data-hint="mbti"><b>${info.name}</b> · ${info.desc}</div>`;
}

function hintHTML(c, key){
  if (key === 'height'){
    const h = parseHeight(c.height);
    if (!h) return `<div class="field-hint" data-hint="height">填入身高后，这里会显示最佳体重范围</div>`;
    const hm = h / 100;
    const minW = (18.5 * hm * hm).toFixed(1);
    const maxW = (23.9 * hm * hm).toFixed(1);
    return `<div class="field-hint" data-hint="height">最佳体重（BMI 18.5–23.9）：<b>${minW} – ${maxW} kg</b></div>`;
  }
  if (key === 'weight'){
    const info = bmiInfo(c);
    if (!info) return `<div class="field-hint" data-hint="weight">同时填入身高和体重后，这里会显示 BMI</div>`;
    return `<div class="field-hint ${info.cls}" data-hint="weight">当前 BMI <b>${info.bmi.toFixed(1)}</b> · ${info.label}</div>`;
  }
  if (key === 'mbti') return mbtiHintHTML(c);
  return '';
}

function updateFieldHints(c){
  const hEl = detailPane.querySelector('[data-hint="height"]');
  if (hEl){
    const h = parseHeight(c.height);
    if (!h){
      hEl.textContent = '填入身高后，这里会显示最佳体重范围';
      hEl.className = 'field-hint';
    } else {
      const hm = h / 100;
      const minW = (18.5 * hm * hm).toFixed(1);
      const maxW = (23.9 * hm * hm).toFixed(1);
      hEl.innerHTML = `最佳体重（BMI 18.5–23.9）：<b>${minW} – ${maxW} kg</b>`;
      hEl.className = 'field-hint';
    }
  }
  const wEl = detailPane.querySelector('[data-hint="weight"]');
  if (wEl){
    const info = bmiInfo(c);
    if (!info){
      wEl.textContent = '同时填入身高和体重后，这里会显示 BMI';
      wEl.className = 'field-hint';
    } else {
      wEl.innerHTML = `当前 BMI <b>${info.bmi.toFixed(1)}</b> · ${info.label}`;
      wEl.className = 'field-hint ' + info.cls;
    }
  }
  const mEl = detailPane.querySelector('[data-hint="mbti"]');
  if (mEl){
    const t = String(c.mbti || '').trim().toUpperCase();
    const info = MBTI_CN[t];
    if (!info){
      mEl.textContent = '选好类型后，这里会显示通俗解释';
      mEl.className = 'field-hint';
    } else {
      const tone = MBTI_TONE[t] || '';
      mEl.innerHTML = `<b>${info.name}</b> · ${info.desc}`;
      mEl.className = 'field-hint mbti-' + tone;
    }
  }
}

function genData(worldKey){

  return c;
}

/* =========================================================
   雷达图
   ========================================================= */
function radarSVG(c){
  const cx = 130, cy = 118, R = 80;
  const pt = (i, r) => {
    const th = -Math.PI/2 + i * Math.PI/3;
    return [cx + r * Math.cos(th), cy + r * Math.sin(th)];
  };
  const fmt = p => p[0].toFixed(1) + ',' + p[1].toFixed(1);
  const val = k => clamp(parseInt(c[k]) || 0, 0, 10);

  let grid = '';
  for (let lv = 1; lv <= 5; lv++){
    const pts = [];
    for (let i = 0; i < 6; i++) pts.push(fmt(pt(i, R * lv / 5)));
    grid += `<polygon points="${pts.join(' ')}" fill="none" stroke="#e3eaf5" stroke-width="1"/>`;
  }

  let axesLine = '';
  for (let i = 0; i < 6; i++){
    const p = pt(i, R);
    axesLine += `<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="#e3eaf5" stroke-width="1"/>`;
  }

  const dataPts = ATTRS.map((a, i) => fmt(pt(i, R * val(a.k) / 10)));

  let dots = '';
  ATTRS.forEach((a, i) => {
    const p = pt(i, R * val(a.k) / 10);
    dots += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="#4f7df3"/>`;
  });

  let labels = '';
  ATTRS.forEach((a, i) => {
    const p = pt(i, R + 20);
    const v = val(a.k);
    labels += `<text x="${p[0].toFixed(1)}" y="${(p[1]-6).toFixed(1)}" text-anchor="middle"
      dominant-baseline="middle" font-size="12" font-weight="600" fill="#5a6b8c">${a.label}</text>`;
    labels += `<text x="${p[0].toFixed(1)}" y="${(p[1]+9).toFixed(1)}" text-anchor="middle"
      dominant-baseline="middle" font-size="11" fill="#4f7df3">${v}</text>`;
  });

  return `<svg viewBox="0 0 260 250" class="radar-svg" width="260" height="250">
    <g>${grid}</g>
    <g>${axesLine}</g>
    <polygon points="${dataPts.join(' ')}" fill="rgba(79,125,243,.26)" stroke="#4f7df3" stroke-width="2" stroke-linejoin="round"/>
    <g>${dots}</g>
    ${labels}
  </svg>`;
}

function updateRadar(c){
  const wrap = detailPane.querySelector('[data-radar-wrap]');
  if (wrap) wrap.innerHTML = radarSVG(c);
}

let toastTimer = null;
function toast(msg, isErr){
  const el = $('toast');
  el.textContent = msg;
  el.classList.toggle('err', !!isErr);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);

/* =========================================================
   角色创建
   ========================================================= */
function createCharacter(worldKey){
  const c = { id: 'c' + (idSeq++) };
  Object.assign(c, genData(worldKey));
  c.color = `hsl(${(hueSeq++ * 137.508) % 360} 62% 66%)`;
  c.x = (Math.random() - 0.5) * 420;
  c.y = (Math.random() - 0.5) * 320;
  c.vx = 0; c.vy = 0; c.fixed = false;
  characters.push(c);
  return c;
}

function autoLinkNew(c){
  const others = characters.filter(x => x.id !== c.id);
  if (!others.length) return;
  const n = Math.min(others.length, chance(0.4) ? 2 : 1);
  pickN(others, n).forEach(o => {
    links.push({ id:'l'+(linkSeq++), a:c.id, b:o.id, type:pick(REL_TYPES), desc:'' });
  });
}

function autoLinkAll(){
  for (let i = 0; i < characters.length; i++){
    for (let j = i + 1; j < characters.length; j++){
      const A = characters[i], B = characters[j];
      if (links.some(l => (l.a===A.id&&l.b===B.id)||(l.a===B.id&&l.b===A.id))) continue;
      if (chance(0.3)) links.push({ id:'l'+(linkSeq++), a:A.id, b:B.id, type:pick(REL_TYPES), desc:'' });
    }
  }
}

/* =========================================================
   详情渲染
   ========================================================= */
function fieldHTML(c, f){
  if (f.type === 'radar'){
    return `<div class="field radar-field"><span class="fl">${f.l}</span>
      <div class="radar-wrap" data-radar-wrap>${radarSVG(c)}</div></div>`;
  }
  const val = c[f.k] ?? '';
  const hasPool = !!POOLS[f.k];
  const wide = f.type === 'textarea' ? ' wide' : '';
  let input;
  if (f.type === 'textarea'){
    input = `<textarea data-key="${f.k}" rows="2">${esc(val)}</textarea>`;
  } else if (f.type === 'number'){
    input = `<input type="number" min="1" max="10" step="1" data-key="${f.k}" value="${esc(val)}" />`;
  } else {
    input = `<input data-key="${f.k}" value="${esc(val)}" />`;
  }
  const hint = hintHTML(c, f.k);
  return `<div class="field${wide}" data-field="${f.k}">
    <span class="fl">${f.l}</span>
    <div class="input-row">
      ${input}
      ${hasPool ? `<button class="mini" data-pool="${f.k}" title="从设定池选择">▾</button>` : ''}
      <button class="mini" data-dice="${f.k}" title="随机一个">🎲</button>
    </div>
    ${hint}
    ${hasPool ? `<div class="pool-pop hidden" data-pop="${f.k}"></div>` : ''}
  </div>`;
}

function renderDetail(){
  const c = getChar(currentId);
  if (!c){
    detailPane.innerHTML = '<div class="empty"><div class="big">✦</div><div>还没有角色，点击左上角「随机生成角色」开始</div></div>';
    return;
  }

  let html = `
    <div class="detail-head">
      <div class="avatar" style="background:${c.color}">${esc((c.name||'?').slice(0,1))}</div>
      <div class="info">
        <input class="big-input" data-key="name" value="${esc(c.name)}" />
        <div class="sub">${esc(c.identity||'')} · ${esc(c.faction||'')} · ${esc(c.alignment||'')}</div>
      </div>
      <div class="head-actions">
        <button data-act="reroll">🎲 重新生成</button>
        <button data-act="delete" class="danger">删除</button>
      </div>
    </div>`;

  FIELD_GROUPS.forEach(g => {
    html += `<section class="fgroup"><h3>${g.title}</h3><div class="grid">`;
    g.fields.forEach(f => { html += fieldHTML(c, f); });
    html += `</div></section>`;
  });

  html += relationSectionHTML(c);
  detailPane.innerHTML = html;
}

function relationSectionHTML(c){
  const rels = links.filter(l => l.a === c.id || l.b === c.id);
  let html = `<section class="fgroup"><h3>人物关系</h3>`;

  if (!rels.length){
    html += `<div style="color:#a8b2c4;font-size:12.5px;padding:4px 0 10px;">暂无关系</div>`;
  } else {
    html += `<div class="rel-list">`;
    rels.forEach(l => {
      const outgoing = l.a === c.id;
      const other = getChar(outgoing ? l.b : l.a);
      if (!other) return;
      html += `<div class="rel-item">
        <span class="dir">${outgoing ? '→' : '←'}</span>
        <span class="who">${esc(other.name)}</span>
        <span class="rtype">${esc(l.type)}</span>
        <span class="rdesc">${esc(l.desc || '')}</span>
        <button class="del" data-act="delrel" data-id="${l.id}" title="删除">×</button>
      </div>`;
    });
    html += `</div>`;
  }

  const others = characters.filter(x => x.id !== c.id);
  if (others.length){
    html += `<div class="rel-add">
      <select id="relTarget">${others.map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select>
      <select id="relType">${REL_TYPES.map(t => `<option>${t}</option>`).join('')}</select>
      <input id="relDesc" placeholder="关系描述（可选）" />
      <button data-act="addrel">添加关系</button>
    </div>`;
  } else {
    html += `<div style="color:#a8b2c4;font-size:12.5px;">至少需要两个角色才能建立关系</div>`;
  }

  html += `</section>`;
  return html;
}

/* =========================================================
   所属势力视图
   ========================================================= */
function renderFactions(){
  if (!characters.length){
    factionPane.innerHTML = '<div class="empty"><div class="big">✦</div><div>还没有角色，点击左上角「随机生成角色」开始</div></div>';
    return;
  }

  const map = new Map();
  characters.forEach(c => {
    const key = String(c.faction || '').trim() || '（未归属势力）';
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(c);
  });

  const entries = [...map.entries()].sort((a, b) =>
    b[1].length - a[1].length || a[0].localeCompare(b[0], 'zh-Hans-CN')
  );

  let html = `<div class="faction-intro">
    <span>共 <span class="num">${entries.length}</span> 个势力</span>
    <span>·</span>
    <span>${characters.length} 名角色</span>
    <span style="margin-left:auto;color:#b6bfd0;">点击成员名可跳转到角色详情</span>
  </div>`;

  html += `<div class="faction-grid">`;
  entries.forEach(([name, list]) => {
    html += `<div class="faction-card">
      <div class="faction-head">
        <span class="faction-name" title="${esc(name)}">${esc(name)}</span>
        <span class="faction-count">${list.length} 人</span>
      </div>
      <div class="faction-members">`;
    list.forEach(c => {
      const active = c.id === currentId ? ' active' : '';
      html += `<span class="member-chip${active}" data-id="${c.id}" title="${esc(c.identity || '')}">
        <span class="dot" style="background:${c.color}"></span>
        <span class="mn">${esc(c.name || '无名')}</span>
      </span>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;

  factionPane.innerHTML = html;
}

function selectChar(id){
  currentId = id;
  renderList();
  renderDetail();
  renderFactions();
  updateSelection();
}

function deleteCharacter(id){
  const c = getChar(id);
  if (!c) return;
  if (!confirm(`确定删除角色「${c.name || '无名'}」？`)) return;
  characters = characters.filter(x => x.id !== id);
  links = links.filter(l => l.a !== id && l.b !== id);
  if (currentId === id) currentId = characters[0]?.id ?? null;
  nodeCard.classList.add('hidden');
  rebuildGraph();
  renderList();
  renderDetail();
  renderFactions();
  markDirty();
}

/* =========================================================
   字段同步 & 池弹层
   ========================================================= */
function syncField(c, key){
  if (['name','identity','faction','alignment'].includes(key)){
    renderList();
  }
  if (key === 'name'){
    const ne = nodeEls[c.id];
    if (ne) ne.nameText.textContent = c.name || '?';
    const av = detailPane.querySelector('.avatar');
    if (av) av.textContent = (c.name || '?').slice(0,1);
  }
  if (key === 'identity' || key === 'faction' || key === 'alignment'){
    const sub = detailPane.querySelector('.detail-head .sub');
    if (sub) sub.textContent = `${c.identity||''} · ${c.faction||''} · ${c.alignment||''}`;
  }
  if (key === 'faction'){
    renderFactions();
  }
  if (key === 'height' || key === 'weight' || key === 'mbti'){
    updateFieldHints(c);
  }
}

function flashInput(el){
  if (!el) return;
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 500);
}

function togglePool(key){
  const field = detailPane.querySelector(`[data-field="${key}"]`);
  if (!field) return;
  const pop = field.querySelector(`[data-pop="${key}"]`);
  if (!pop) return;

  if (!pop.classList.contains('hidden')){ pop.classList.add('hidden'); return; }

  detailPane.querySelectorAll('.pool-pop').forEach(p => p.classList.add('hidden'));

  const c = getChar(currentId);
  if (!c) return;
  const W = WORLDS[c.world] || WORLDS[currentWorld];
  const poolDef = POOLS[key];
  if (!poolDef) return;
  const arr = typeof poolDef === 'function' ? poolDef(W) : poolDef;
  const cur = String(c[key] || '').split('、').map(s => s.trim()).filter(Boolean);

  pop.innerHTML = arr.map(v => {
    let label = esc(v);
    if (key === 'mbti' && MBTI_CN[v]){
      label = `${esc(v)}<small>${esc(MBTI_CN[v].name)}</small>`;
    }
    return `<span class="pool-tag${cur.includes(v) ? ' on' : ''}" data-val="${esc(v)}">${label}</span>`;
  }).join('');
  pop.classList.remove('hidden');
}

function applyPoolValue(c, key, val, pop){
  const field = pop.closest('.field');
  const input = field.querySelector('[data-key]');
  if (MULTI.has(key)){
    const parts = String(input.value || '').split('、').map(s => s.trim()).filter(Boolean);
    if (!parts.includes(val)) parts.push(val);
    input.value = parts.join('、');
    pop.querySelectorAll('.pool-tag').forEach(t =>
      t.classList.toggle('on', parts.includes(t.dataset.val)));
  } else {
    input.value = val;
    pop.querySelectorAll('.pool-tag').forEach(t =>
      t.classList.toggle('on', t.dataset.val === val));
  }
  c[key] = input.value;
  syncField(c, key);
  markDirty();
}

detailPane.addEventListener('input', e => {
  const key = e.target.dataset.key;
  if (!key) return;
  const c = getChar(currentId);
  if (!c) return;
  let v = e.target.value;
  if (key.startsWith('attr')){
    v = String(clamp(parseInt(v) || 0, 0, 10));
  }
  c[key] = v;
  if (key.startsWith('attr')) updateRadar(c);
  syncField(c, key);
  markDirty();
});

detailPane.addEventListener('click', e => {
  const c = getChar(currentId);
  if (!c) return;
  const W = WORLDS[c.world] || WORLDS[currentWorld];

  const tag = e.target.closest('.pool-tag');
  if (tag){
    const pop = tag.closest('.pool-pop');
    applyPoolValue(c, pop.dataset.pop, tag.dataset.val, pop);
    return;
  }
  const poolBtn = e.target.closest('[data-pool]');
  if (poolBtn){ togglePool(poolBtn.dataset.pool); return; }

  const dice = e.target.closest('[data-dice]');
  if (dice){
    const key = dice.dataset.dice;
    const val = genValue(key, W);
    c[key] = val;
    const field = dice.closest('.field');
    const input = field.querySelector('[data-key]');
    input.value = val;
    const pop = field.querySelector('.pool-pop');
    if (pop && !pop.classList.contains('hidden')){
      const cur = String(val).split('、').map(s => s.trim());
      pop.querySelectorAll('.pool-tag').forEach(t =>
        t.classList.toggle('on', cur.includes(t.dataset.val)));
    }
    if (key.startsWith('attr')) updateRadar(c);
    syncField(c, key);
    flashInput(input);
    markDirty();
    return;
  }

  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;

  if (act === 'reroll'){
    const keep = { id:c.id, color:c.color, x:c.x, y:c.y, vx:0, vy:0, fixed:false, world:c.world };
    Object.assign(c, genData(c.world), keep);
    renderDetail(); renderList(); renderFactions(); rebuildGraph(); markDirty();
  }
  else if (act === 'delete'){
    deleteCharacter(c.id);
  }
  else if (act === 'addrel'){
    const target = $('relTarget')?.value;
    const type = $('relType')?.value || '旧识';
    const desc = $('relDesc')?.value || '';
    if (target && target !== c.id){
      links.push({ id:'l'+(linkSeq++), a:c.id, b:target, type, desc });
      rebuildGraph(); renderDetail(); markDirty();
    }
  }
  else if (act === 'delrel'){
    links = links.filter(l => l.id !== btn.dataset.id);
    rebuildGraph(); renderDetail(); markDirty();
  }
});

/* =========================================================
   关系图
   ========================================================= */
const NODE_R = 26;
let nodeEls = {};
let linkEls = [];
let dragNode = null, panning = false, lastPt = null, movedFlag = false;

function applyView(){
  view.setAttribute('transform', `translate(${tx},${ty}) scale(${k})`);
}
function ensureView(){
  if (tx === null){
    tx = (svg.clientWidth || 800) / 2;
    ty = (svg.clientHeight || 600) / 2;
    applyView();
  }
}

function rebuildGraph(){
  view.innerHTML = '';
  nodeEls = {};
  linkEls = [];

  links.forEach(l => {
    if (!getChar(l.a) || !getChar(l.b)) return;
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'link');
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('marker-end', 'url(#arrow)');
    const text = document.createElementNS(NS, 'text');
    text.setAttribute('class', 'link-label');
    text.textContent = l.type;
    g.append(line, text);
    view.appendChild(g);
    linkEls.push({ l, line, text });
  });

  characters.forEach(c => {
    if (typeof c.x !== 'number') c.x = (Math.random() - 0.5) * 420;
    if (typeof c.y !== 'number') c.y = (Math.random() - 0.5) * 320;
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'node');
    g.dataset.id = c.id;

    const circle = document.createElementNS(NS, 'circle');
    circle.setAttribute('r', NODE_R);
    circle.setAttribute('fill', c.color);

    const initial = document.createElementNS(NS, 'text');
    initial.setAttribute('class', 'node-initial');
    initial.setAttribute('dy', '7');
    initial.textContent = (c.name || '?').slice(0, 1);

    const nm = document.createElementNS(NS, 'text');
    nm.setAttribute('class', 'node-name');
    nm.setAttribute('dy', NODE_R + 18);
    nm.textContent = c.name || '无名';

    g.append(circle, initial, nm);
    view.appendChild(g);
    nodeEls[c.id] = { g, circle, nameText: nm };
  });

  updateSelection();
}

function updateSelection(){
  Object.entries(nodeEls).forEach(([id, el]) => {
    el.g.classList.toggle('selected', id === currentId);
  });
}

function simulate(){
  const n = characters.length;
  if (!n) return;

  for (let i = 0; i < n; i++){
    const a = characters[i];
    for (let j = i + 1; j < n; j++){
      const b = characters[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx*dx + dy*dy;
      if (d2 < 4){ dx = Math.random()-0.5; dy = Math.random()-0.5; d2 = 4; }
      const d = Math.sqrt(d2);
      const f = 9500 / d2;
      const fx = dx/d*f, fy = dy/d*f;
      a.vx -= fx; a.vy -= fy;
      b.vx += fx; b.vy += fy;
    }
  }

  links.forEach(l => {
    const a = getChar(l.a), b = getChar(l.b);
    if (!a || !b) return;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    const f = (d - 165) * 0.022;
    const fx = dx/d*f, fy = dy/d*f;
    a.vx += fx; a.vy += fy;
    b.vx -= fx; b.vy -= fy;
  });

  characters.forEach(c => {
    c.vx += -c.x * 0.0045;
    c.vy += -c.y * 0.0045;
    if (c.fixed){ c.vx = 0; c.vy = 0; return; }
    c.vx *= 0.85; c.vy *= 0.85;
    c.vx = clamp(c.vx, -18, 18);
    c.vy = clamp(c.vy, -18, 18);
    c.x += c.vx;
    c.y += c.vy;
  });
}

function draw(){
  characters.forEach(c => {
    const el = nodeEls[c.id];
    if (el) el.g.setAttribute('transform', `translate(${c.x.toFixed(2)},${c.y.toFixed(2)})`);
  });

  linkEls.forEach(L => {
    const a = getChar(L.l.a), b = getChar(L.l.b);
    if (!a || !b) return;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    const x1 = a.x + dx/d*NODE_R, y1 = a.y + dy/d*NODE_R;
    const x2 = b.x - dx/d*(NODE_R + 9), y2 = b.y - dy/d*(NODE_R + 9);
    L.line.setAttribute('x1', x1);
    L.line.setAttribute('y1', y1);
    L.line.setAttribute('x2', x2);
    L.line.setAttribute('y2', y2);
    L.text.setAttribute('x', (x1 + x2) / 2);
    L.text.setAttribute('y', (y1 + y2) / 2 - 4);
  });
}

function loop(){
  simulate();
  draw();
  requestAnimationFrame(loop);
}

function toWorld(clientX, clientY){
  const r = svg.getBoundingClientRect();
  return { x: (clientX - r.left - tx) / k, y: (clientY - r.top - ty) / k };
}

svg.addEventListener('pointerdown', e => {
  const nodeG = e.target.closest ? e.target.closest('.node') : null;
  movedFlag = false;
  if (nodeG){
    const c = getChar(nodeG.dataset.id);
    if (!c) return;
    dragNode = c;
    c.fixed = true;
    c.vx = c.vy = 0;
  } else {
    panning = true;
    lastPt = { x: e.clientX, y: e.clientY };
    nodeCard.classList.add('hidden');
  }
  try { svg.setPointerCapture(e.pointerId); } catch(_){}
});

svg.addEventListener('pointermove', e => {
  if (dragNode){
    const p = toWorld(e.clientX, e.clientY);
    if (Math.hypot(p.x - dragNode.x, p.y - dragNode.y) > 1.5) movedFlag = true;
    dragNode.x = p.x;
    dragNode.y = p.y;
    dragNode.vx = dragNode.vy = 0;
  } else if (panning && lastPt){
    const dx = e.clientX - lastPt.x, dy = e.clientY - lastPt.y;
    if (Math.abs(dx) + Math.abs(dy) > 2) movedFlag = true;
    tx += dx; ty += dy;
    lastPt = { x: e.clientX, y: e.clientY };
    applyView();
    nodeCard.classList.add('hidden');
  }
});

svg.addEventListener('pointerup', e => {
  if (dragNode){
    dragNode.fixed = false;
    if (!movedFlag){
      selectChar(dragNode.id);
      showCard(dragNode);
    }
    dragNode = null;
  }
  panning = false;
  lastPt = null;
  try { svg.releasePointerCapture(e.pointerId); } catch(_){}
});

svg.addEventListener('pointercancel', () => {
  if (dragNode){ dragNode.fixed = false; dragNode = null; }
  panning = false;
});

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const oldK = k;
  k = clamp(k * (e.deltaY < 0 ? 1.12 : 0.893), 0.28, 2.8);
  tx = mx - (mx - tx) * (k / oldK);
  ty = my - (my - ty) * (k / oldK);
  applyView();
  nodeCard.classList.add('hidden');
}, { passive:false });

function showCard(c){
  const info = bmiInfo(c);
  const bmiRow = info
    ? `<div class="row"><span>BMI</span><div>${info.bmi.toFixed(1)} · ${info.label}</div></div>`
    : '';
  const mbtiKey = String(c.mbti || '').trim().toUpperCase();
  const mbtiCN = MBTI_CN[mbtiKey];
  const mbtiRow = mbtiCN
    ? `<div class="row"><span>性格</span><div>${esc(mbtiCN.name)}</div></div>`
    : '';
  nodeCard.innerHTML = `
    <div class="ch">
      <span class="dot" style="background:${c.color}"></span>
      <b>${esc(c.name)}</b>
      <button class="x" data-close>×</button>
    </div>
    <div class="cs">${esc(c.alias)} · ${esc(c.identity)}</div>
    <div class="row"><span>势力</span><div>${esc(c.faction)}</div></div>
    <div class="row"><span>阵营</span><div>${esc(c.alignment)}</div></div>
    ${mbtiRow}
    ${bmiRow}
    <div class="row"><span>欲望</span><div>${esc(c.desire)}</div></div>
    <div class="row"><span>恐惧</span><div>${esc(c.fear)}</div></div>
    <div class="actions">
      <button data-edit>查看 / 编辑详情</button>
    </div>`;

  const paneRect = graphPane.getBoundingClientRect();
  let left = c.x * k + tx + 34;
  let top  = c.y * k + ty - 40;
  const W = 252, H = 290;
  left = clamp(left, 10, Math.max(10, paneRect.width - W - 10));
  top  = clamp(top, 10, Math.max(10, paneRect.height - H - 10));
  nodeCard.style.left = left + 'px';
  nodeCard.style.top = top + 'px';
  nodeCard.classList.remove('hidden');
}

nodeCard.addEventListener('click', e => {
  if (e.target.closest('[data-close]')){
    nodeCard.classList.add('hidden');
    return;
  }
  if (e.target.closest('[data-edit]')){
    switchTab('detail');
    nodeCard.classList.add('hidden');
  }
});

/* =========================================================
   Tab
   ========================================================= */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  detailPane.classList.toggle('hidden', name !== 'detail');
  graphPane.classList.toggle('hidden', name !== 'graph');
  factionPane.classList.toggle('hidden', name !== 'faction');
  graphTools.classList.toggle('hidden', name !== 'graph');

  if (name === 'graph'){
    requestAnimationFrame(() => {
      ensureView();
      applyView();
    });
  }
  if (name === 'faction'){
    renderFactions();
  }
}

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => switchTab(t.dataset.tab);
});

graphTools.addEventListener('click', e => {
  const btn = e.target.closest('button[data-gt]');
  if (!btn) return;
  const a = btn.dataset.gt;
  if (a === 'in'){ k = clamp(k * 1.2, 0.28, 2.8); }
  else if (a === 'out'){ k = clamp(k / 1.2, 0.28, 2.8); }
  else if (a === 'reset'){
    tx = (svg.clientWidth || 800) / 2;
    ty = (svg.clientHeight || 600) / 2;
    k = 1;
  }
  else if (a === 'shake'){
    characters.forEach(c => {
      c.vx += (Math.random() - 0.5) * 30;
      c.vy += (Math.random() - 0.5) * 30;
    });
  }
  applyView();
  nodeCard.classList.add('hidden');
});

/* =========================================================
   保存 / 读取 / 导入 / 导出
   ========================================================= */
const SAVE_KEY = 'charForge_v1';

function buildSaveData(){
  return {
    version: 3,
    savedAt: Date.now(),
    currentWorld,
    currentId,
    idSeq, linkSeq, hueSeq,
    characters,
    links
  };
}

let saveTimer = null;
function markDirty(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveToLocal(true), 900);
}

function saveToLocal(silent){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(buildSaveData()));
    if (!silent) toast('已保存到浏览器');
  }catch(err){
    if (!silent) toast('保存失败：本地存储空间可能已满', true);
  }
}

function loadFromLocal(){
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw){ toast('没有找到本地存档', true); return; }
  try{
    applySaveData(JSON.parse(raw));
    toast('已读取本地存档');
  }catch(err){
    toast('存档解析失败', true);
  }
}

function applySaveData(d){
  if (!d || typeof d !== 'object') throw new Error('bad');
  characters = Array.isArray(d.characters) ? d.characters : [];
  links = Array.isArray(d.links) ? d.links : [];
  idSeq = d.idSeq || (characters.length + 1);
  linkSeq = d.linkSeq || (links.length + 1);
  hueSeq = d.hueSeq || characters.length;
  currentWorld = (d.currentWorld && WORLDS[d.currentWorld]) ? d.currentWorld : currentWorld;

  characters.forEach(c => {
    if (!c.world || !WORLDS[c.world]) c.world = currentWorld;
    if (!c.color) c.color = `hsl(${(hueSeq++ * 137.508) % 360} 62% 66%)`;
    if (typeof c.x !== 'number') c.x = (Math.random() - 0.5) * 420;
    if (typeof c.y !== 'number') c.y = (Math.random() - 0.5) * 320;
    c.vx = 0; c.vy = 0; c.fixed = false;
    ALL_FIELDS.forEach(f => {
      if (c[f.k] === undefined){
        if (f.type === 'number') c[f.k] = String(3 + Math.floor(Math.random()*7));
        else c[f.k] = '';
      }
    });
    ATTRS.forEach(a => {
      if (c[a.k] === undefined || c[a.k] === ''){
        c[a.k] = String(3 + Math.floor(Math.random()*7));
      }
    });
  });

  links = links.filter(l => getChar(l.a) && getChar(l.b));

  currentId = (d.currentId && characters.some(c => c.id === d.currentId))
    ? d.currentId
    : (characters[0]?.id || null);

  worldSel.value = currentWorld;
  tx = null;
  nodeCard.classList.add('hidden');
  rebuildGraph();
  renderList();
  renderDetail();
  renderFactions();
}

function exportJSON(){
  if (!characters.length){ toast('还没有角色可以导出', true); return; }
  const blob = new Blob([JSON.stringify(buildSaveData(), null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  a.href = url;
  a.download = `角色存档_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('已导出 JSON 文件');
}

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      applySaveData(JSON.parse(reader.result));
      toast('已导入存档');
    }catch(err){
      toast('文件格式有误，无法导入', true);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* =========================================================
   顶栏
   ========================================================= */
Object.keys(WORLDS).forEach(w => {
  const o = document.createElement('option');
  o.value = w; o.textContent = w;
  worldSel.appendChild(o);
});
worldSel.value = currentWorld;
worldSel.onchange = () => { currentWorld = worldSel.value; };

$('btnGen').onclick = () => {
  const c = createCharacter(currentWorld);
  autoLinkNew(c);
  currentId = c.id;
  rebuildGraph(); renderList(); renderDetail(); renderFactions(); markDirty();
};

$('btnGen5').onclick = () => {
  const start = characters.length;
  for (let i = 0; i < 5; i++) createCharacter(currentWorld);
  for (let i = start; i < characters.length; i++) autoLinkNew(characters[i]);
  if (!currentId && characters.length) currentId = characters[0].id;
  rebuildGraph(); renderList(); renderDetail(); renderFactions(); markDirty();
};

$('btnLink').onclick = () => {
  if (characters.length < 2){ toast('至少需要两个角色', true); return; }
  const before = links.length;
  autoLinkAll();
  rebuildGraph(); renderDetail(); markDirty();
  toast(links.length > before ? `新增 ${links.length - before} 条关系` : '没有产生新关系');
};

$('btnClear').onclick = () => {
  if (!characters.length) return;
  if (!confirm('确定清空所有角色和关系？')) return;
  characters = []; links = []; currentId = null;
  nodeCard.classList.add('hidden');
  rebuildGraph(); renderList(); renderDetail(); renderFactions(); markDirty();
};

$('btnSave').onclick   = () => saveToLocal(false);
$('btnLoad').onclick   = () => loadFromLocal();
$('btnExport').onclick = () => exportJSON();
$('btnImport').onclick = () => fileInput.click();

window.addEventListener('resize', () => { nodeCard.classList.add('hidden'); });

/* =========================================================
   初始化
   ========================================================= */
function init(){
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw){
    try{
      applySaveData(JSON.parse(raw));
      requestAnimationFrame(loop);
      return;
    }catch(err){ /* 存档坏了重新开始 */ }
  }
  for (let i = 0; i < 5; i++) createCharacter(currentWorld);
  autoLinkAll();
  currentId = characters[0].id;
  rebuildGraph();
  renderList();
  renderDetail();
  renderFactions();
  requestAnimationFrame(loop);
}

init();
</script>
