

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片水平合成工具</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    background: #f3f5f8;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    color: #333;
}

.container {
    max-width: 1150px;
    margin: auto;
    padding: 25px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.05);
}

h2 {
    margin-top: 0;
}

h3 {
    margin-top: 25px;
}

/* 上传区域 */
.upload {
    display: block;
    padding: 30px;
    text-align: center;
    border: 2px dashed #bbb;
    border-radius: 10px;
    cursor: pointer;
    color: #666;
    transition: .2s;
}

.upload:hover,
.upload.active {
    border-color: #1677ff;
    background: #f5f9ff;
    color: #1677ff;
}

.upload input {
    display: none;
}

/* 图片列表 */
.image-list {
    display: flex;
    flex-wrap: nowrap;
    align-items: flex-start;
    gap: 12px;
    margin: 20px 0;
    padding: 10px 4px;
    min-height: 170px;
    overflow-x: auto;
}

.image-item {
    flex: 0 0 135px;
    position: relative;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
    text-align: center;
    cursor: grab;
    user-select: none;
    transition: transform .15s, opacity .15s;
}

.image-item:active {
    cursor: grabbing;
}

.image-item.dragging {
    opacity: .35;
    border: 2px dashed #1677ff;
}

.image-item.drag-over {
    border: 2px solid #1677ff;
    transform: scale(1.04);
}

.image-item img {
    display: block;
    width: 100%;
    height: 85px;
    object-fit: contain;
    pointer-events: none;
}

.image-name {
    margin-top: 7px;
    font-size: 12px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.image-number {
    font-size: 12px;
    color: #1677ff;
    margin-top: 4px;
}

/* 删除按钮 */
.remove-btn {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 23px;
    height: 23px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: #f04444;
    color: white;
    cursor: pointer;
    font-size: 15px;
    line-height: 23px;
}

/* 左右移动按钮 */
.image-actions {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
}

.move-btn {
    flex: 1;
    height: 30px;
    padding: 0;
    border: 1px solid #d9e2f0;
    border-radius: 5px;
    background: #f5f8fc;
    color: #1677ff;
    font-size: 18px;
    cursor: pointer;
    transition: .15s;
}

.move-btn:hover:not(:disabled) {
    color: white;
    background: #1677ff;
    border-color: #1677ff;
}

.move-btn:disabled {
    color: #ccc;
    background: #f5f5f5;
    border-color: #eee;
    cursor: not-allowed;
}

/* 配置区域 */
.toolbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    margin: 20px 0;
}

.toolbar label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 14px;
}

input,
select,
button {
    font-size: 14px;
}

input[type="number"],
select {
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 6px;
}

input[type="number"] {
    width: 80px;
}

input[type="color"] {
    width: 35px;
    height: 30px;
    border: none;
    cursor: pointer;
}

input[type="checkbox"] {
    cursor: pointer;
}

.button {
    padding: 9px 16px;
    color: white;
    background: #1677ff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.button:hover {
    background: #0958d9;
}

.button.danger {
    background: #e5484d;
}

.button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

/* 状态信息 */
.info {
    margin: 15px 0;
    font-size: 13px;
    color: #666;
}

/* 预览区域 */
.preview {
    min-height: 180px;
    padding: 20px;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    overflow: auto;
    border: 1px solid #ddd;
    border-radius: 8px;
    background-color: #fff;
    background-image:
        linear-gradient(45deg,#eee 25%,transparent 25%),
        linear-gradient(-45deg,#eee 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#eee 75%),
        linear-gradient(-45deg,transparent 75%,#eee 75%);
    background-size: 20px 20px;
    background-position:
        0 0,0 10px,10px -10px,-10px 0;
}

canvas {
    display: block;
    max-width: none;
    flex-shrink: 0;
    margin: auto;
}

.tip {
    margin-top: 10px;
    font-size: 12px;
    color: #999;
}

@media(max-width:600px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 15px;
    }

    .toolbar {
        gap: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h2>图片水平合成工具</h2>

    <!-- 上传图片 -->
    <label class="upload" id="uploadArea">
        <input type="file" id="fileInput" accept="image/*" multiple>
        <div style="font-size:18px">＋ 添加图片</div>
        <div style="font-size:13px;margin-top:8px">
            点击选择图片，也可以拖放图片到这里
        </div>
    </label>

    <!-- 图片列表 -->
    <h3>图片排列</h3>
    <div class="tip">
        可以拖动图片排序，也可以使用缩略图下方的左右按钮调整位置
    </div>

    <div class="image-list" id="imageList"></div>

    <!-- 操作配置 -->
    <div class="toolbar">

        <label>
            图片间距
            <input type="number" id="gap" value="0" min="0">
            px
        </label>

        <label>
            垂直对齐
            <select id="align">
                <option value="top">顶部对齐</option>
                <option value="center" selected>居中对齐</option>
                <option value="bottom">底部对齐</option>
            </select>
        </label>

        <label>
            背景颜色
            <input type="color" id="bgColor" value="#ffffff">
        </label>

        <label>
            <input type="checkbox" id="transparent" checked>
            透明背景
        </label>

        <button class="button" id="composeBtn">
            重新合成
        </button>

        <button class="button" id="downloadBtn" disabled>
            下载图片
        </button>

        <button class="button danger" id="clearBtn">
            清空图片
        </button>

    </div>

    <!-- 合成状态 -->
    <div class="info" id="info">
        暂无图片，请先添加图片
    </div>

    <!-- 合成预览 -->
    <h3>合成预览</h3>

    <div class="preview">
        <canvas id="canvas"></canvas>
    </div>

</div>

<script>

// ===============================
// 1. 全局变量
// ===============================

const fileInput = document.getElementById("fileInput");
const imageList = document.getElementById("imageList");
const uploadArea = document.getElementById("uploadArea");

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const composeBtn = document.getElementById("composeBtn");
const downloadBtn = document.getElementById("downloadBtn");
const clearBtn = document.getElementById("clearBtn");

const info = document.getElementById("info");

// 图片数组，数组顺序就是最终合成顺序
let images = [];

// 当前拖动的图片 ID
let dragId = null;

// 图片 ID
let nextId = 1;


// ===============================
// 2. 图片加载
// ===============================

function loadImage(file) {

    return new Promise((resolve, reject) => {

        const url = URL.createObjectURL(file);
        const img = new Image();

        img.onload = function() {

            resolve({
                id: nextId++,
                name: file.name,
                img: img,
                url: url,
                width: img.naturalWidth,
                height: img.naturalHeight
            });

        };

        img.onerror = function() {

            URL.revokeObjectURL(url);
            reject(new Error("图片加载失败：" + file.name));

        };

        img.src = url;

    });

}


// ===============================
// 3. 添加图片
// ===============================

async function addImages(files) {

    const fileArray = Array.from(files)
        .filter(file => file.type.startsWith("image/"));

    if (!fileArray.length) return;

    info.textContent = "正在加载图片...";

    const results = await Promise.allSettled(
        fileArray.map(loadImage)
    );

    let successCount = 0;

    results.forEach(result => {

        if (result.status === "fulfilled") {
            images.push(result.value);
            successCount++;
        }

    });

    if (successCount > 0) {
        renderImageList();
        compose();
    }

    const failedCount = results.length - successCount;

    if (failedCount > 0) {
        info.textContent += `，${failedCount} 张图片加载失败`;
    }

}

// 文件选择
fileInput.addEventListener("change", function() {

    addImages(this.files);

    this.value = "";

});


// ===============================
// 4. 左右移动图片
// ===============================

function moveImage(index, direction) {

    const targetIndex = index + direction;

    // 判断目标位置是否合法
    if (
        targetIndex < 0 ||
        targetIndex >= images.length
    ) {
        return;
    }

    // 交换两个图片的位置
    const temp = images[index];

    images[index] = images[targetIndex];

    images[targetIndex] = temp;

    // 更新列表
    renderImageList();

    // 更新合成预览
    compose();

}


// ===============================
// 5. 删除图片
// ===============================

function removeImage(id) {

    const index = images.findIndex(item => item.id === id);

    if (index < 0) return;

    const item = images[index];

    URL.revokeObjectURL(item.url);

    images.splice(index, 1);

    renderImageList();

    compose();

}


// ===============================
// 6. 渲染图片列表
// ===============================

function renderImageList() {

    imageList.innerHTML = "";

    images.forEach((item, index) => {

        const div = document.createElement("div");

        div.className = "image-item";
        div.draggable = true;
        div.dataset.id = item.id;

        // 图片
        const img = document.createElement("img");

        img.src = item.url;
        img.alt = item.name;
        img.draggable = false;

        // 名称
        const name = document.createElement("div");

        name.className = "image-name";
        name.textContent = item.name;

        // 编号
        const number = document.createElement("div");

        number.className = "image-number";
        number.textContent = `第 ${index + 1} 张`;

        // 删除按钮
        const removeBtn = document.createElement("button");

        removeBtn.className = "remove-btn";
        removeBtn.type = "button";
        removeBtn.textContent = "×";
        removeBtn.title = "删除图片";
        removeBtn.draggable = false;

        removeBtn.addEventListener("click", function(e) {

            e.stopPropagation();

            removeImage(item.id);

        });

        // ===========================
        // 左右移动按钮
        // ===========================

        const actions = document.createElement("div");

        actions.className = "image-actions";

        // 左移按钮
        const leftBtn = document.createElement("button");

        leftBtn.className = "move-btn";
        leftBtn.type = "button";
        leftBtn.textContent = "←";
        leftBtn.title = "向左移动";
        leftBtn.draggable = false;

        // 第一张不能左移
        leftBtn.disabled = index === 0;

        leftBtn.addEventListener("click", function(e) {

            e.preventDefault();
            e.stopPropagation();

            moveImage(index, -1);

        });

        // 右移按钮
        const rightBtn = document.createElement("button");

        rightBtn.className = "move-btn";
        rightBtn.type = "button";
        rightBtn.textContent = "→";
        rightBtn.title = "向右移动";
        rightBtn.draggable = false;

        // 最后一张不能右移
        rightBtn.disabled = index === images.length - 1;

        rightBtn.addEventListener("click", function(e) {

            e.preventDefault();
            e.stopPropagation();

            moveImage(index, 1);

        });

        actions.appendChild(leftBtn);
        actions.appendChild(rightBtn);

        // 组合元素
        div.appendChild(img);
        div.appendChild(name);
        div.appendChild(number);
        div.appendChild(actions);
        div.appendChild(removeBtn);


        // ===========================
        // 拖拽排序
        // ===========================

        // 开始拖动
        div.addEventListener("dragstart", function(e) {

            if (e.target.closest("button")) {
                e.preventDefault();
                return;
            }

            dragId = item.id;

            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData(
                "text/plain",
                String(item.id)
            );

            this.classList.add("dragging");

        });

        // 拖动经过
        div.addEventListener("dragover", function(e) {

            e.preventDefault();

            if (dragId === null || dragId === item.id) return;

            e.dataTransfer.dropEffect = "move";

            document.querySelectorAll(".image-item")
                .forEach(el => {
                    el.classList.remove("drag-over");
                });

            this.classList.add("drag-over");

        });

        // 离开
        div.addEventListener("dragleave", function() {

            this.classList.remove("drag-over");

        });

        // 放下
        div.addEventListener("drop", function(e) {

            e.preventDefault();

            const from = images.findIndex(
                image => image.id === dragId
            );

            const to = images.findIndex(
                image => image.id === item.id
            );

            if (from < 0 || to < 0 || from === to) {
                dragId = null;
                return;
            }

            // 判断放在目标图片左侧还是右侧
            const rect = this.getBoundingClientRect();

            let insertIndex = e.clientX >
                rect.left + rect.width / 2
                ? to + 1
                : to;

            // 取出被拖动图片
            const movedImage = images.splice(from, 1)[0];

            // 调整目标位置
            if (from < insertIndex) {
                insertIndex--;
            }

            // 插入
            images.splice(insertIndex, 0, movedImage);

            dragId = null;

            renderImageList();

            compose();

        });

        // 拖动结束
        div.addEventListener("dragend", function() {

            dragId = null;

            document.querySelectorAll(".image-item")
                .forEach(el => {

                    el.classList.remove(
                        "dragging",
                        "drag-over"
                    );

                });

        });

        imageList.appendChild(div);

    });

}


// ===============================
// 7. 清空图片
// ===============================

function clearImages() {

    images.forEach(item => {
        URL.revokeObjectURL(item.url);
    });

    images = [];

    canvas.width = 0;
    canvas.height = 0;

    renderImageList();

    info.textContent = "暂无图片，请先添加图片";

    downloadBtn.disabled = true;

    fileInput.value = "";

}

clearBtn.addEventListener("click", clearImages);


// ===============================
// 8. 图片合成
// ===============================

function compose() {

    if (!images.length) {

        canvas.width = 0;
        canvas.height = 0;

        info.textContent = "暂无图片";

        downloadBtn.disabled = true;

        return;

    }

    const gap = Math.floor(Math.max(
        0,
        Number(document.getElementById("gap").value) || 0
    ));

    const align = document.getElementById("align").value;

    const bgColor = document.getElementById("bgColor").value;

    const transparent = document.getElementById("transparent").checked;


    // 计算总宽度
    const totalWidth = images.reduce(
        (sum, item) => sum + item.width,
        0
    ) + gap * (images.length - 1);

    // 计算最大高度
    const maxHeight = Math.max(
        ...images.map(item => item.height)
    );


    // 设置画布
    canvas.width = totalWidth;
    canvas.height = maxHeight;

    // 清空画布
    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // 设置背景
    if (!transparent) {

        ctx.fillStyle = bgColor;

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }


    // 按照当前数组顺序绘制
    let x = 0;

    images.forEach(item => {

        let y = 0;

        // 居中
        if (align === "center") {
            y = (maxHeight - item.height) / 2;
        }

        // 底部对齐
        else if (align === "bottom") {
            y = maxHeight - item.height;
        }

        ctx.drawImage(
            item.img,
            x,
            y,
            item.width,
            item.height
        );

        x += item.width + gap;

    });


    // 更新状态
    info.textContent =
        `合成成功：${images.length} 张图片 | ` +
        `宽度：${canvas.width}px | ` +
        `高度：${canvas.height}px`;

    downloadBtn.disabled = false;

}


// ===============================
// 9. 配置修改后自动合成
// ===============================

composeBtn.addEventListener("click", compose);

document.getElementById("gap")
    .addEventListener("input", compose);

document.getElementById("align")
    .addEventListener("change", compose);

document.getElementById("bgColor")
    .addEventListener("input", compose);

document.getElementById("transparent")
    .addEventListener("change", compose);


// ===============================
// 10. 下载 PNG
// ===============================

downloadBtn.addEventListener("click", function() {

    if (!images.length) return;

    canvas.toBlob(function(blob) {

        if (!blob) {
            alert("图片生成失败，请检查图片尺寸");
            return;
        }

        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = url;
        a.download = "水平合成图片.png";

        document.body.appendChild(a);

        a.click();

        a.remove();

        setTimeout(() => {
            URL.revokeObjectURL(url);
        }, 1000);

    }, "image/png");

});


// ===============================
// 11. 支持拖放文件上传
// ===============================

uploadArea.addEventListener("dragover", function(e) {

    e.preventDefault();

    this.classList.add("active");

});

uploadArea.addEventListener("dragleave", function(e) {

    if (!this.contains(e.relatedTarget)) {
        this.classList.remove("active");
    }

});

uploadArea.addEventListener("drop", function(e) {

    e.preventDefault();

    this.classList.remove("active");

    addImages(e.dataTransfer.files);

});

</script>

</body>
</html>
